spring:
  application:
    name: whats-mine-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

  jpa:
    properties:
      hibernate:
        globally_quoted_identifiers: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false
        same-site: LAX

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  name: ${APP_NAME:Hub Notification}
  version: ${APP_VERSION:1.0.0}
  demo-mode: ${APP_DEMO_MODE:false}
  installed: ${APP_INSTALLED:true}
  url: ${APP_URL:http://localhost:8080}

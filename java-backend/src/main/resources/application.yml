spring:
  application:
    name: whats-mine-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

  jpa:
    properties:
      hibernate:
        globally_quoted_identifiers: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false
        same-site: LAX

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  name: ${APP_NAME:Hub Notification}
  version: ${APP_VERSION:1.0.0}
  demo-mode: ${APP_DEMO_MODE:false}
  installed: ${APP_INSTALLED:true}
  url: ${APP_URL:http://localhost:8080}

# Self-hosted license verification (Botble License Manager API). Disabled by
# default — an operator running their own copy of this app has no reason to
# license-gate it; this only matters if this build is itself being
# distributed/resold and the operator opts in with real credentials.
license:
  verify: ${LICENSE_VERIFY:false}
  server-url: ${LICENSE_SERVER_URL:}
  api-key: ${LICENSE_API_KEY:}
  product-id: ${LICENSE_PRODUCT_ID:}
  verify-type: ${LICENSE_VERIFY_TYPE:non_envato}
  cache-hours: ${LICENSE_CACHE_HOURS:12}

whatsapp:
  api:
    base-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
    api-version: ${WHATSAPP_API_VERSION:v18.0}
    system-user-token: ${WHATSAPP_SYSTEM_USER_TOKEN:demo_system_user_token}
    app-id: ${META_APP_ID:demo_meta_app_id}
    app-secret: ${META_APP_SECRET:demo_meta_app_secret}
    global-verify-token: ${WHATSAPP_GLOBAL_VERIFY_TOKEN:wh_global_verify}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

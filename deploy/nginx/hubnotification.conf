# Reverse proxy for the Spring Boot app, with WebSocket upgrade support
# (spring-boot-starter-websocket is used for realtime broadcast — typing
# indicators, live message updates — which silently breaks if a proxy in
# front of it doesn't forward the Upgrade/Connection headers).
#
# TLS is live for hubnotification.srjhubnest.com (cert issued via certbot).

server {
    listen 80;
    server_name hubnotification.srjhubnest.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hubnotification.srjhubnest.com;

    ssl_certificate     /etc/letsencrypt/live/hubnotification.srjhubnest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hubnotification.srjhubnest.com/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# Reverse proxy for the Spring Boot app, with WebSocket upgrade support
# (spring-boot-starter-websocket is used for realtime broadcast — typing
# indicators, live message updates — which silently breaks if a proxy in
# front of it doesn't forward the Upgrade/Connection headers).
#
# Replace yourdomain.com below, then:
#   1. First boot WITHOUT TLS (comment out the 443 server block and the
#      redirect in the 80 block) so certbot's HTTP-01 challenge can reach
#      /.well-known/acme-challenge/ over plain HTTP.
#   2. Run: docker compose run --rm certbot certonly --webroot \
#        -w /var/www/certbot -d yourdomain.com
#   3. Uncomment the 443 block and the redirect, reload nginx.

server {
    listen 80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment once a real certificate exists (step 3 above):
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}


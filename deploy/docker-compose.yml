# Production stack for one VPS: app + mysql. Reverse proxy / TLS termination is
# handled by a HOST-LEVEL nginx (NOT a container here) — this box also runs an
# unrelated CRM stack for a teammate, and both apps' domains are served by that
# one shared host nginx via separate sites-available/* server blocks, each with
# its own certbot-issued cert. Our app is reached at 127.0.0.1:8080 (published
# below) from the host nginx site at /etc/nginx/sites-available/hubnotification.*.
# Do NOT add an nginx/certbot service back here — it would fight the host nginx
# for ports 80/443.
#
# Lives on the server at ${PROD_APP_DIR} (see Jenkinsfile / DEPLOY.md), NOT built by Jenkins —
# Jenkins only edits the `app` image tag (via `sed`, see Jenkinsfile's Deploy stage) and runs
# `docker compose up -d app`. mysql is started once by hand during first-time setup and
# is left running across deploys.
#
# Secrets (DB password, etc.) live in a server-local `.env` next to this file — Jenkins never
# sees it. Copy .env.example to .env on the server and fill in real values before first boot.

services:
  app:
    # No CI/CD registry in use on this deployment — built locally on the server
    # from source each deploy (see ./app, populated by copying java-backend/
    # there and running `docker compose build app`). If Jenkins/a registry
    # workflow is set up later, swap this back to an `image:` reference.
    build: ./app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-whatsmine}
      DB_USERNAME: ${DB_USERNAME:-whatsmine}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_URL: ${APP_URL}
    ports:
      - "127.0.0.1:8080:8080" # only the host nginx talks to this; not exposed publicly
    volumes:
      - app_storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-whatsmine}
      MYSQL_USER: ${DB_USERNAME:-whatsmine}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  app_storage:
